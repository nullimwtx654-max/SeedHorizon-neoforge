<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VoxelCraft</title>
<style>
  :root{--bg:#1a1a2e;--fg:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#f472b6;--surface:#16213e;--border:#243352;--danger:#ef4444;--success:#22c55e}
  *{border-box:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,sans-serif}
  canvas{display:block}
  #hud{position:fixed;inset:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:12px 16px 12px 72px;font-size:14px;gap:12px}
  .hud-left,.hud-right{display:flex;gap:10px;align-items:center}
  .hud-center{text-align:center}
  #minimap{width:120px;height:120px;border:2px solid var(--accent);border-radius:6px;background:var(--surface);image-rendering:pixelated;flex-shrink:0}
  .hud-item{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px}
  .hud-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot-air{background:#8ba0d8}.dot-grass{background:#4caf50}.dot-stone{background:#85a37a}
  #controls{position:fixed;bottom:12px;left:16px;right:16px;display:flex;gap:10px;justify-content:space-between;align-items:center;pointer-events:auto}
  .btn{background:var(--surface);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;user-select:none;touch-action:manipulation;min-height:44px}
  .btn:active{background:var(--border)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .slot{width:44px;height:44px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--surface);cursor:grab;touch-action:none}
  #minimap canvas{width:100%;height:100%}
  .help{position:fixed;top:8px;right:12px;max-width:340px;pointer-events:none}
  .help .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;pointer-events:auto;max-width:260px}
  .help .card h4{font-size:13px;margin-bottom:4px;color:var(--accent)}
  @media(max-width:640px){#hud{grid-template-columns:1fr auto}.hud-left,.hud-right{width:100%;justify-content:space-between}.help{top:12px;right:8px;max-width:280px}#minimap{width:90px;height:90px}}
</style>
</head>
<body>
  <div id="hud">
    <div class="hud-left">
      <div class="hud-item dot-dirt">Dirt</div>
      <div class="hud-item dot-grass">Grass</div>
      <div class="hud-item dot-stone">Stone</div>
    </div>
    <div class="hud-center"><div id="minimap"><canvas></div></div>
    <div class="hud-right">
      <div class="hud-item" id="pos-label">Pos: 0,0,0</div>
      <div class="hud-item" id="block-label">Air</div>
    </div>
  </div>
  <div class="help card">
    <h4>Controls</h4>
    <p>• WASD move • Click to dig • Drag look</p>
    <p>• 1/2/3 tools • Click &amp; hold to dig</p>
  </div>
  <div id="controls">
    <div class="slot" draggable="true" id="slot-pick">⛏️</div>
    <div class="slot" draggable="true" id="slot-axe">🪓</div>
    <div class="slot" draggable="true" id="slot-shovel">⛏️</div>
    <div class="slot" draggable="true" id="slot-torch">🕯️</div>
    <button class="btn" id="btn-reset">Reset</button>
    <button class="btn" id="btn-build" disabled>Build</button>
  </div>
<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="engine.js"></script>
</body>
</html>
