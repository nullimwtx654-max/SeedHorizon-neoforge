name: Build APK and Publish GitHub Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'VoxelCraft Ultra v3.1 (Crash-Proof Edition)'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Fixed startup crash: native fullscreen theme, valid vector icon, and safe edge-to-edge display cutout.'

permissions:
  contents: write

jobs:
  build:
    name: Build APKs & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Generate Self-Signed Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias voxelcraft -keyalg RSA -keysize 2048 -validity 10000             -storepass "voxelcraft123" -keypass "voxelcraft123" -dname "CN=VoxelCraft, OU=Game, O=VoxelCraft, L=City, S=State, C=US"

      - name: Build Debug & Release APK
        run: |
          gradle assembleDebug assembleRelease             -PRELEASE_STORE_FILE=../release.keystore             -PRELEASE_STORE_PASSWORD=voxelcraft123             -PRELEASE_KEY_ALIAS=voxelcraft             -PRELEASE_KEY_PASSWORD=voxelcraft123

      - name: Rename APKs for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/VoxelCraft-Ultra-v3.1-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/VoxelCraft-Ultra-v3.1-release.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCraft-Ultra-APKs
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v3.1.0' }}
          name: ${{ github.event.inputs.release_title || github.ref_name || 'VoxelCraft Ultra v3.1.0' }}
          body: |
            ### 🎮 VoxelCraft Ultra 3.1 — Crash-Free Official Release

            Fixed all startup crash triggers:
            - 🛡️ **Zero Startup Crashes:** Replaced conflicting window translucent theme flags with clean `values-v28` and `values-v29` resource qualifiers.
            - 📱 **Edge-to-Edge Display Cutout:** Renders completely into the camera notch without letterboxing (`shortEdges`).
            - 🧭 **Gestural Navigation Bar:** Renders under transparent system bars with touch-safe insets.
            - 🎨 **Local Vector Icon:** Added native vector app icon to eliminate missing resource crashes.
            - 🌓 **Soft Balanced Lighting:** Removed harsh cloud shadows and tuned contrast to 30% natural.

            #### 📥 Direct Downloads:
            - **Release APK:** `VoxelCraft-Ultra-v3.1-release.apk`
            - **Debug APK:** `VoxelCraft-Ultra-v3.1-debug.apk`
          files: |
            dist/VoxelCraft-Ultra-v3.1-release.apk
            dist/VoxelCraft-Ultra-v3.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
