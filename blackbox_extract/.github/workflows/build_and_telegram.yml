name: Build BlackBox with microG

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_gmscore_from_source:
        description: 'Compile microG GmsCore from source (instead of fast official release fetch)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build microG + BlackBox APKs
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK, NDK, and Licenses
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ] && [ -d "$HOME/Android/Sdk" ]; then
            SDK_DIR="$HOME/Android/Sdk"
          fi
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          sudo mkdir -p "$SDK_DIR/licenses" "$SDK_DIR/platforms" "$SDK_DIR/build-tools" "$SDK_DIR/ndk"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || sudo chmod -R 777 "$SDK_DIR" || true

          for hash in 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee 859f317696f67ef3d7f30a50a5560e7834b43903; do
            echo "$hash" >> "$SDK_DIR/licenses/android-sdk-license"
          done
          for hash in 84831b9409646a918e30573bab4c9c91346d8abd 504667f4c0de7af1a06de9f4b1727b84351f2910; do
            echo "$hash" >> "$SDK_DIR/licenses/android-sdk-preview-license"
          done
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_DIR/licenses/intel-android-extra-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$SDK_DIR/licenses/google-gdk-license"

          if [ -d "$SDK_DIR/ndk" ]; then
            INSTALLED_NDK=$(ls -1 "$SDK_DIR/ndk" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$INSTALLED_NDK" ]; then
              echo "ANDROID_NDK_VERSION=$INSTALLED_NDK" >> "$GITHUB_ENV"
              echo "Detected pre-installed NDK: $INSTALLED_NDK"
            fi
          fi

          echo "sdk.dir=$SDK_DIR" > local.properties
          if [ -d "gms-core" ]; then
            echo "sdk.dir=$SDK_DIR" > gms-core/local.properties
          fi

      - name: Verify Gradle Wrapper and AGP Versions
        run: |
          python3 - << 'PYEOF'
          import os, re, urllib.request

          def url_ok(url):
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return resp.status < 400
              except Exception:
                  return False

          # 1. Verify gradle-wrapper.properties distributionUrl
          gw_path = "gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(gw_path):
              with open(gw_path) as f:
                  gw = f.read()
              m = re.search(r"distributionUrl=(.+)", gw)
              if m:
                  raw_url = m.group(1).strip().replace("\:", ":")
                  if not url_ok(raw_url):
                      for ver in ["8.14.3", "8.14.2", "8.14", "8.13", "8.12.1", "8.11.1", "8.10.2"]:
                          test_url = f"https://services.gradle.org/distributions/gradle-{ver}-bin.zip"
                          if url_ok(test_url):
                              print(f"Resolved working Gradle distribution: {ver}")
                              gw = re.sub(r"distributionUrl=.+", f"distributionUrl=https\://services.gradle.org/distributions/gradle-{ver}-bin.zip", gw)
                              with open(gw_path, "w") as f:
                                  f.write(gw)
                              break

          # 2. Verify AGP version in gradle/libs.versions.toml
          toml_path = "gradle/libs.versions.toml"
          if os.path.exists(toml_path):
              with open(toml_path) as f:
                  toml = f.read()
              m = re.search(r'agp\s*=\s*"([^"]+)"', toml)
              if m:
                  agp_ver = m.group(1)
                  pom_url = f"https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/{agp_ver}/gradle-{agp_ver}.pom"
                  if not url_ok(pom_url):
                      for ver in ["8.9.1", "8.9.0", "8.8.2", "8.8.0", "8.7.3", "8.7.2", "8.6.1", "8.5.2"]:
                          test_pom = f"https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/{ver}/gradle-{ver}.pom"
                          if url_ok(test_pom):
                              print(f"Resolved working AGP version: {ver}")
                              toml = re.sub(r'agp\s*=\s*"[^"]+"', f'agp = "{ver}"', toml)
                              with open(toml_path, "w") as f:
                                  f.write(toml)
                              if os.path.exists("gms-core/build.gradle"):
                                  with open("gms-core/build.gradle") as gf:
                                      gtxt = gf.read()
                                  gtxt = re.sub(r"ext\.androidBuildGradleVersion\s*=\s*'[^']+'", f"ext.androidBuildGradleVersion = '{ver}'", gtxt)
                                  with open("gms-core/build.gradle", "w") as gf:
                                      gf.write(gtxt)
                              break

          # 3. Verify Wire and Guava versions in gms-core/build.gradle if present
          if os.path.exists("gms-core/build.gradle"):
              with open("gms-core/build.gradle") as gf:
                  gtxt = gf.read()
              for wver in ["6.4.6", "5.3.1", "5.2.1", "5.1.0", "5.0.0", "4.9.9"]:
                  if url_ok(f"https://repo1.maven.org/maven2/com/squareup/wire/wire-gradle-plugin/{wver}/wire-gradle-plugin-{wver}.pom"):
                      gtxt = re.sub(r"ext\.wireVersion\s*=\s*'[^']+'", f"ext.wireVersion = '{wver}'", gtxt)
                      break
              for gver in ["33.5.0-android", "33.4.0-android", "33.3.1-android", "33.2.1-android", "33.0.0-android"]:
                  if url_ok(f"https://repo1.maven.org/maven2/com/google/guava/guava/{gver}/guava-{gver}.pom"):
                      gtxt = re.sub(r"ext\.guavaVersion\s*=\s*'[^']+'", f"ext.guavaVersion = '{gver}'", gtxt)
                      break
              with open("gms-core/build.gradle", "w") as gf:
                  gf.write(gtxt)
          PYEOF

      - name: Grant execute permissions for gradlew
        run: |
          chmod +x ./gradlew
          if [ -f "./gms-core/gradlew" ]; then
            chmod +x ./gms-core/gradlew
          fi

      - name: Fetch or Build microG (GmsCore & FakeStore)
        run: |
          mkdir -p Bcore/src/main/assets/gms
          python3 - << 'PYEOF'
          import json, os, re, urllib.request

          gms_out = "Bcore/src/main/assets/gms/GmsCore.apk"
          vending_out = "Bcore/src/main/assets/gms/FakeStore.apk"

          def download(url, path):
              try:
                  print(f"Downloading {url} -> {path} ...")
                  headers = {"User-Agent": "Mozilla/5.0"}
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=120) as resp, open(path, "wb") as out:
                      while True:
                          chunk = resp.read(65536)
                          if not chunk:
                              break
                          out.write(chunk)
                  if os.path.exists(path) and os.path.getsize(path) > 50000:
                      print(f"Successfully downloaded {path} ({os.path.getsize(path)} bytes)")
                      return True
              except Exception as e:
                  print(f"Download failed for {url}: {e}")
              return False

          gms_urls = []
          vending_urls = []

          # 1. Query GitHub Releases API for microg/GmsCore
          try:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "NewBlackbox-CI"
              }
              token = os.environ.get("GITHUB_TOKEN", "").strip()
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request("https://api.github.com/repos/microg/GmsCore/releases?per_page=15", headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              for rel in releases:
                  for asset in rel.get("assets", []):
                      name = asset.get("name", "")
                      url = asset.get("browser_download_url", "")
                      if re.match(r"^com\.google\.android\.gms-[0-9]+\.apk$", name) and url:
                          gms_urls.append(url)
                      elif re.match(r"^com\.android\.vending-[0-9]+\.apk$", name) and url:
                          vending_urls.append(url)
          except Exception as e:
              print(f"GitHub Releases API lookup note: {e}")

          # 2. Query official microG F-Droid repository index as secondary dynamic source
          try:
              req = urllib.request.Request("https://microg.org/fdroid/repo/index-v1.json", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  fdroid = json.loads(resp.read().decode("utf-8"))
              pkgs = fdroid.get("packages", {})
              for pkg_info in pkgs.get("com.google.android.gms", []):
                  apk_name = pkg_info.get("apkName")
                  if apk_name:
                      gms_urls.append(f"https://microg.org/fdroid/repo/{apk_name}")
              for pkg_info in pkgs.get("com.android.vending", []):
                  apk_name = pkg_info.get("apkName")
                  if apk_name:
                      vending_urls.append(f"https://microg.org/fdroid/repo/{apk_name}")
          except Exception as e:
              print(f"F-Droid repo lookup note: {e}")

          # 3. Known direct release asset fallbacks
          gms_urls.extend([
              "https://github.com/microg/GmsCore/releases/download/v0.3.17.252432/com.google.android.gms-252432034.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.google.android.gms-250932032.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.15.250932/com.google.android.gms-250932030.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.13.250932/com.google.android.gms-244735012.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.6.244735/com.google.android.gms-244735012.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.2.240913/com.google.android.gms-240913006.apk",
          ])
          vending_urls.extend([
              "https://github.com/microg/GmsCore/releases/download/v0.3.17.252432/com.android.vending-84022634.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.android.vending-84022632.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.15.250932/com.android.vending-84022630.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.13.250932/com.android.vending-84022612.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.6.244735/com.android.vending-84022612.apk",
              "https://github.com/microg/GmsCore/releases/download/v0.3.2.240913/com.android.vending-84022606.apk",
          ])

          for u in gms_urls:
              if os.path.exists(gms_out) and os.path.getsize(gms_out) > 100000:
                  break
              download(u, gms_out)

          for u in vending_urls:
              if os.path.exists(vending_out) and os.path.getsize(vending_out) > 50000:
                  break
              download(u, vending_out)
          PYEOF

          if [ "${{ github.event.inputs.build_gmscore_from_source }}" = "true" ] || [ ! -s Bcore/src/main/assets/gms/GmsCore.apk ] || [ ! -s Bcore/src/main/assets/gms/FakeStore.apk ]; then
            if [ -d "gms-core" ] && (cd gms-core && ./gradlew :play-services-core:assembleMapboxDefaultRelease :vending-app:assembleDefaultRelease --no-daemon --stacktrace); then
              GMS_APK=$(find ./gms-core/play-services-core/build/outputs/apk -name "com.google.android.gms-*.apk" ! -name "*unsigned*" 2>/dev/null | head -n 1 || true)
              VENDING_APK=$(find ./gms-core/vending-app/build/outputs/apk -name "com.android.vending-*.apk" ! -name "*unsigned*" 2>/dev/null | head -n 1 || true)
              if [ -n "$GMS_APK" ] && [ -f "$GMS_APK" ]; then
                cp -f "$GMS_APK" Bcore/src/main/assets/gms/GmsCore.apk
              fi
              if [ -n "$VENDING_APK" ] && [ -f "$VENDING_APK" ]; then
                cp -f "$VENDING_APK" Bcore/src/main/assets/gms/FakeStore.apk
              fi
            fi
          fi
          ls -lh Bcore/src/main/assets/gms/ || true

      - name: Build NewBlackbox APKs and Bcore AARs
        run: |
          ./gradlew assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease :black-reflection:assemble :compiler:assemble --no-daemon --stacktrace

      - name: Upload BlackBox Release & Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: BlackBox-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Bundled microG APKs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: microG-APKs
          path: |
            Bcore/src/main/assets/gms/*.apk

      - name: Upload Bcore AARs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Bcore-AARs
          path: |
            Bcore/build/outputs/aar/*.aar

      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-build
          name: "BlackBox + microG Latest Build"
          body: "Automated build of NewBlackbox with integrated microG (GmsCore + FakeStore) Google Login support."
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            Bcore/build/outputs/aar/*.aar

      - name: Send Artifacts to Telegram (Optional)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s || echo "Manual Build")
          for APK in ./app/build/outputs/apk/release/*.apk ./app/build/outputs/apk/debug/*.apk; do
            if [ -f "$APK" ]; then
              curl -s -F document=@"$APK" -F chat_id="$TELEGRAM_CHAT_ID" -F caption="[BlackBox+microG] $(basename "$APK") - $COMMIT_MSG" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" || true
            fi
          done
