[mod]
id = "potato_horizon"
version = "0.1.0"
priority = 100

[compatibility]
hooks = 1
horizon_revision = "d009ebd"

# Pure-Rust LOD core (also compiled standalone by Cargo for unit tests).
# Injected into horizon-client as crate::game::potato_horizon.
[[module]]
name = "potato_horizon"
parent = "crates/horizon-client/src/game/mod.rs"
source = "runtime.rs"

# Horizon-side adapter (chunk surface capture, heightmap sampler, far-terrain upload).
# Injected into horizon-client as crate::game::potato_horizon_bridge.
[[module]]
name = "potato_horizon_bridge"
parent = "crates/horizon-client/src/game/mod.rs"
source = "bridge.rs"

# 1. Tick hook: rate-limited surface capture & unvisited chunk sampling
[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
fn_name = "on_tick"

# 2. Frame hook: time-budgeted greedy meshing & far-terrain submission
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
fn_name = "on_frame"

# 3. Chat command hook: /plod status|on|off|distance|real|preset|caves|save|clear
[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
fn_name = "on_command"

# 4. Options > Mods listing
[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mods.rs"
fn_name = "on_mods"

# 5. Options > Mods > PotatoHorizon settings page
[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
fn_name = "on_settings"

# 6. Options > Mods > PotatoHorizon button clicks
[[injection]]
id = "settings_click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
fn_name = "on_settings_click"

# 7. Extend renderer far-plane and distance fog smoothly to the 16-chunk LOD ring
[[injection]]
id = "terrain_distance"
target = "crates/horizon-client/src/game/mod.rs::Game::terrain_distance"
kind = "RETURN"
helper = "terrain_distance.rs"
fn_name = "on_terrain_distance"
