name: Build NeoForge Mod
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build JAR
        run: |
          [ -f "VoxelRay-neoforge-1.21.1-src.zip" ] && unzip -q -o "VoxelRay-neoforge-1.21.1-src.zip"
          cd voxelray-neoforge-1.21.1
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out-jars"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out-jars/"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: out-jars/*.jar
